# Merged suite file: suite definition + device/prerequisite form.

id: interfaces
name: Interfaces
description: Interface configuration validation tests.

tests:
  - interface-description-change
  - interfaces-admin-state-disabled

version: 1
sections:

  - id: connectivity
    title: Connectivity
    fields:

      - id: dut_management_ip
        label: DUT Management IP / Hostname
